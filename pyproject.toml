description = "Add your description here"
readme = "README.md"
authors = [
    { name = "thepassant", email = "bassant.ayman69@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.163.1",
    "joblib>=1.6.0",
    "optbinning>=1.0.0",
    "pandas>=3.1.1",
    "pydantic>=2.14.3",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
    "scikit-learn>=1.9.1",
